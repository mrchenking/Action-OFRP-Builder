name: Recovery_Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      SYNC_URL:
        description: 'SYNC_URL'
        required: false
        default: 'https://gitlab.com/OrangeFox/sync.git'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: false
        default: '12.1'
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: false
        default: 'https://github.com/mrchenking/android_device_oplus_qqcandy_twrp'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: false
        default: 'main'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: false
        default: 'device/oplus/qqcandy'
      COMMON_TREE_URL:
        description: 'COMMON_TREE_URL (leave blank if none)'
        required: false
        default: ''
      COMMON_PATH:
        description: 'COMMON_PATH (leave blank if none)'
        required: false
        default: ''
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: false
        default: 'qqcandy'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME'
        required: false
        default: 'twrp_qqcandy'
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: false
        default: 'vendorboot'

env:
  SYNC_URL: ${{ github.event.inputs.SYNC_URL || 'https://gitlab.com/OrangeFox/sync.git' }}
  MANIFEST_BRANCH: ${{ github.event.inputs.MANIFEST_BRANCH || '12.1' }}
  DEVICE_TREE_URL: ${{ github.event.inputs.DEVICE_TREE_URL || 'https://github.com/mrchenking/android_device_oplus_qqcandy_twrp' }}
  DEVICE_TREE_BRANCH: ${{ github.event.inputs.DEVICE_TREE_BRANCH || 'main' }}
  DEVICE_PATH: ${{ github.event.inputs.DEVICE_PATH || 'device/oplus/qqcandy' }}
  COMMON_TREE_URL: ${{ github.event.inputs.COMMON_TREE_URL || '' }}
  COMMON_PATH: ${{ github.event.inputs.COMMON_PATH || '' }}
  DEVICE_NAME: ${{ github.event.inputs.DEVICE_NAME || 'qqcandy' }}
  MAKEFILE_NAME: ${{ github.event.inputs.MAKEFILE_NAME || 'twrp_qqcandy' }}
  BUILD_TARGET: ${{ github.event.inputs.BUILD_TARGET || 'vendorboot' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check Out
        uses: actions/checkout@v4

      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@main

      - name: Initialize workspace
        id: pwd
        run: |
          mkdir workspace
          cd workspace
          echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT

      - name: Prepare the build environment
        run: |
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -yq --no-upgrade \
              linux-modules-extra-$(uname -r) \
              git python3 tar aria2 ccache rclone

      - name: Install OpenJDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Setup SSH Keys
        if: startsWith(env.SYNC_URL, 'git@github.com') || startsWith(env.DEVICE_TREE_URL, 'git@github.com') || startsWith(env.COMMON_TREE_URL, 'git@github.com')
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Restore OrangeFox scripts cache
        id: cache-scripts
        uses: actions/cache@v4
        with:
          path: ${{ steps.pwd.outputs.workspace-folder }}/scripts
          key: fox-scripts-v1
          restore-keys: fox-scripts-

      - name: Clone OrangeFox scripts
        if: steps.cache-scripts.outputs.cache-hit != 'true'
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}
        run: git clone https://gitlab.com/OrangeFox/misc/scripts

      - name: Setup build environment via scripts
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}/scripts
        run: |
          sudo bash setup/android_build_env.sh
          sed -i 's/cd -/cd ../g' setup/install_android_sdk.sh
          sudo bash setup/install_android_sdk.sh

      - name: Configure rclone for R2
        continue-on-error: true
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << RCEOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ACCESS_KEY }}
          secret_access_key = ${{ secrets.R2_SECRET_KEY }}
          endpoint = ${{ secrets.R2_ENDPOINT }}
          RCEOF

      - name: Restore ccache from R2
        continue-on-error: true
        run: |
          mkdir -p ~/.ccache
          if [ -n "${{ secrets.R2_BUCKET }}" ]; then
            rclone sync r2:${{ secrets.R2_BUCKET }}/ccache/${{ env.DEVICE_NAME }} ~/.ccache \
              --transfers 8 --checkers 16 || echo "No ccache found"
          fi
          ccache -M 8G
          ccache -s

      - name: Restore fox source cache
        id: cache-source
        uses: actions/cache@v4
        with:
          path: ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}
          key: fox-source-${{ env.MANIFEST_BRANCH }}-v3

      - name: Sync OrangeFox sources and minimal manifest
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}
        run: |
          echo "SYNC_URL=$SYNC_URL"
          echo "MANIFEST_BRANCH=$MANIFEST_BRANCH"
          if [ ! -d "fox_${MANIFEST_BRANCH}/.repo" ]; then
            echo "Cloning OrangeFox sync repo..."
            git clone "$SYNC_URL" sync
            cd sync
            ./orangefox_sync.sh --branch "$MANIFEST_BRANCH" --path "${{ steps.pwd.outputs.workspace-folder }}/fox_${MANIFEST_BRANCH}"
          else
            echo "Cache hit, running incremental sync..."
            cd "fox_${MANIFEST_BRANCH}"
            repo sync -c --no-clone-bundle --no-tags --optimized-fetch -j$(nproc --all)
          fi

      - name: Clone device tree
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}
        run: git clone "$DEVICE_TREE_URL" -b "$DEVICE_TREE_BRANCH" ./"$DEVICE_PATH"

      - name: Clone common tree
        if: env.COMMON_TREE_URL != '' && env.COMMON_PATH != ''
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}
        run: git clone "$COMMON_TREE_URL" -b "$DEVICE_TREE_BRANCH" ./"$COMMON_PATH"

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Building recovery
        continue-on-error: true
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}
        run: |
          export JAVA_HOME=$JAVA_HOME_11_X64
          export PATH=$JAVA_HOME/bin:$PATH
          export USE_CCACHE=1
          export CCACHE_DIR=$HOME/.ccache
          set +e
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          set -e
          lunch "${MAKEFILE_NAME}-eng" && make clean && mka adbd "${BUILD_TARGET}image" -j$(nproc --all)
          ccache -s

      - name: Fix vendor_boot DT Table
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}
        run: |
          VENDOR_BOOT="out/target/product/${DEVICE_NAME}/vendor_boot.img"
          DTB_FILE="${DEVICE_PATH}/prebuilt/dtb.img"
          if [ -f "$VENDOR_BOOT" ] && [ -f "$DTB_FILE" ]; then
            echo "Fixing vendor_boot DT Table..."
            python3 "${DEVICE_PATH}/fix_vendor_boot.py" "$VENDOR_BOOT" "$VENDOR_BOOT" "$DTB_FILE"
            echo "vendor_boot fixed"
          else
            echo "Skipping fix: files not found"
            ls -la "$VENDOR_BOOT" 2>/dev/null || echo "  vendor_boot.img not found"
            ls -la "$DTB_FILE" 2>/dev/null || echo "  dtb.img not found"
          fi

      - name: Save ccache to R2
        if: always()
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.R2_BUCKET }}" ]; then
            rclone sync ~/.ccache "r2:${{ secrets.R2_BUCKET }}/ccache/${DEVICE_NAME}" \
              --transfers 8 --checkers 16 || true
          fi

      - name: Check the output directory before uploading
        run: |
          ls -al ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}/out/target/product/ 2>/dev/null || true
          echo
          ls -al ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/ 2>/dev/null || true

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/*.img
            ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/*.zip
          name: ${{ env.DEVICE_NAME }}-${{ github.run_id }}
          tag_name: ${{ github.run_id }}
          body: |
            Manifest: ${{ env.MANIFEST_BRANCH }}
            Device: ${{ env.DEVICE_NAME }}
            Target: ${{ env.BUILD_TARGET }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
