name: Recovery Build

on:
  workflow_dispatch:
    inputs:
      SYNC_URL:
        description: 'OrangeFox sync URL'
        required: true
        default: 'https://gitlab.com/OrangeFox/sync.git'
      MANIFEST_BRANCH:
        description: 'OrangeFox manifest branch'
        required: true
        default: '12.1'
      DEVICE_TREE_URL:
        description: 'Device tree repository URL'
        required: true
        default: 'https://github.com/mrchenking/android_device_oplus_qqcandy_twrp'
      DEVICE_TREE_BRANCH:
        description: 'Device tree branch'
        required: true
        default: 'main'
      DEVICE_PATH:
        description: 'Device tree path in source tree'
        required: true
        default: 'device/oplus/qqcandy'
      DEVICE_NAME:
        description: 'Device codename'
        required: true
        default: 'qqcandy'
      MAKEFILE_NAME:
        description: 'Makefile name'
        required: true
        default: 'twrp_qqcandy'
      BUILD_TARGET:
        description: 'Build target'
        required: true
        default: 'vendor_boot'
      COMMON_TREE_URL:
        description: 'Common tree URL (optional)'
        required: false
        default: ''
      COMMON_PATH:
        description: 'Common tree path (optional)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Cleanup
        run: |
          docker rmi $(docker images -q) || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo apt-get autoremove -y || true
          sudo apt-get clean || true
          df -h
          
      - name: Initialize workspace
        id: pwd
        run: |
          mkdir workspace
          cd workspace
          echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
          
      - name: Prepare build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git repo python3 openjdk-17-jdk
          
      - name: Install OpenJDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup SSH Keys
        if: startsWith(github.event.inputs.SYNC_URL, 'git@') || startsWith(github.event.inputs.DEVICE_TREE_URL, 'git@') || (github.event.inputs.COMMON_TREE_URL != '' && startsWith(github.event.inputs.COMMON_TREE_URL, 'git@'))
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.SSH_PRIVATE_KEY }}
            
      - name: Restore OrangeFox scripts cache
        id: cache-scripts
        uses: actions/cache@v4
        with:
          path: ${{ steps.pwd.outputs.workspace-folder }}/scripts
          key: fox-scripts-v1
          
      - name: Clone OrangeFox scripts
        if: steps.cache-scripts.outputs.cache-hit != 'true'
        run: |
          cd ${{ steps.pwd.outputs.workspace-folder }}
          git clone --depth=1 https://gitlab.com/OrangeFox/misc/scripts.git
          
      - name: Setup build environment via scripts
        run: |
          cd ${{ steps.pwd.outputs.workspace-folder }}/scripts
          sudo bash setup/android_build_env.sh || true
          sudo bash setup/install_android_sdk.sh || true
          
      - name: Configure rclone for R2
        if: env.R2_ACCESS_KEY != ''
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = \${{ secrets.R2_ACCESS_KEY }}
          secret_access_key = \${{ secrets.R2_SECRET_KEY }}
          endpoint = \${{ secrets.R2_ENDPOINT }}
          EOF
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          
      - name: Restore ccache from R2
        if: env.R2_ACCESS_KEY != ''
        run: |
          mkdir -p ~/.ccache
          rclone sync r2:${{ secrets.R2_BUCKET }}/ccache/${{ github.event.inputs.DEVICE_NAME }} ~/.ccache --transfers=10 --checkers=20 || true
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          
      - name: Restore fox source cache
        id: cache-source
        uses: actions/cache@v4
        with:
          path: ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          key: fox-source-${{ github.event.inputs.MANIFEST_BRANCH }}-v2
          restore-keys: |
            fox-source-${{ github.event.inputs.MANIFEST_BRANCH }}-
            
      - name: Sync OrangeFox sources and minimal manifest
        run: |
          cd ${{ steps.pwd.outputs.workspace-folder }}
          if [ ! -d "fox_${{ github.event.inputs.MANIFEST_BRANCH }}/.repo" ]; then
            git clone --depth=1 ${{ github.event.inputs.SYNC_URL }} sync
            cd sync
            ./orangefox_sync.sh --branch ${{ github.event.inputs.MANIFEST_BRANCH }} --path ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          else
            echo "Fox source already synced, updating..."
            cd fox_${{ github.event.inputs.MANIFEST_BRANCH }}
            repo sync -j4 || repo sync -j2 || repo sync -j1
          fi
        continue-on-error: false
        
      - name: Clone device tree
        run: |
          cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ${{ github.event.inputs.DEVICE_PATH }}
          
      - name: Clone common tree
        if: github.event.inputs.COMMON_TREE_URL != '' && github.event.inputs.COMMON_PATH != ''
        run: |
          cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          git clone ${{ github.event.inputs.COMMON_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ${{ github.event.inputs.COMMON_PATH }}
          
      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12
          
      - name: Building recovery
        run: |
          cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch ${{ github.event.inputs.MAKEFILE_NAME }}-eng
          mka ${{ github.event.inputs.BUILD_TARGET }} -j$(nproc)
        continue-on-error: true
        
      - name: Save ccache to R2
        if: always() && env.R2_ACCESS_KEY != ''
        continue-on-error: true
        run: |
          rclone sync ~/.ccache r2:${{ secrets.R2_BUCKET }}/ccache/${{ github.event.inputs.DEVICE_NAME }} --transfers=10 --checkers=20
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          
      - name: Check the output directory before uploading
        if: always()
        run: |
          echo "Checking output directory..."
          find ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out -name "*.img" || true
          
      - name: Fix vendor_boot DT Table
        run: |
          python3 ${{ github.event.inputs.DEVICE_PATH }}/fix_vendor_boot.py
        continue-on-error: true
        
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.img
            ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
